name: Stage Ivory Botanica catalog cover
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stage-ivory-botanica-card.yml"

permissions:
  contents: write

jobs:
  stage-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download uploaded cover
        env:
          ASSET_URL: 'https://oaisdmntpraustraliaeast.blob.core.windows.net/files/00000000-f4cc-81fa-8e04-438c7db1a75c/raw?se=2026-09-15T08%3A47%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a402-7e21-77ea-98d4-ce929fe10fec&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T22%3A30%3A51Z&ske=2026-09-15T22%3A30%3A51Z&sks=b&skv=2026-02-06&sig=TRx6aZFoERksu3Rgl1xdJ0RegVkp5Jnh4q1Ts%2BPDCR4%3D'
        run: |
          set -euo pipefail
          mkdir -p public/theme-previews/wedding
          curl --fail --location --retry 3 --retry-delay 2             --output public/theme-previews/wedding/ivory-botanica-card.jpg             "$ASSET_URL"
          test -s public/theme-previews/wedding/ivory-botanica-card.jpg
          test "$(wc -c < public/theme-previews/wedding/ivory-botanica-card.jpg)" -eq 231422

      - name: Commit cover and remove staging workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/theme-previews/wedding/ivory-botanica-card.jpg
          git rm .github/workflows/stage-ivory-botanica-card.yml
          git commit -m "Add Ivory Botanica catalog cover"
          git push origin main
