name: Apply flexible wedding events editor patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/patch-flexible-events.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/reseller/invitations/[id]/page.tsx'); s=p.read_text()
          def sub(pattern,repl,label,flags=0):
            global s
            s2,n=re.subn(pattern,repl,s,count=1,flags=flags)
            if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
            s=s2
          sub(r'(type PhotoField = .*?;\n)',r'''\1
type WeddingEventForm = { name: string; date: string; time: string; location: string; mapsUrl: string };
const emptyWeddingEvent = (): WeddingEventForm => ({ name: "", date: "", time: "", location: "", mapsUrl: "" });
''','type')
          sub(r'(  const \[form, setForm\] = useState<FormState>\(initialForm\);\n)',r'''\1  const [weddingEvents, setWeddingEvents] = useState<WeddingEventForm[]>([]);
  const [coverEventIndex, setCoverEventIndex] = useState(0);
''','state')
          sub(r'      setSlug\(invitation\.slug \|\| ""\);\n\n      setForm\(\{',r'''      setSlug(invitation.slug || "");
      const storedEvents: WeddingEventForm[] = Array.isArray(invitation.events) ? invitation.events.slice(0, 4).map((event: Record<string, unknown>) => ({ name: String(event.name || event.title || ""), date: String(event.date || "").slice(0, 10), time: String(event.time || ""), location: String(event.location || ""), mapsUrl: String(event.mapsUrl || event.maps_url || "") })) : [];
      const legacyEvents: WeddingEventForm[] = [
        { name: "Akad", date: String(invitation.akad_date || "").slice(0, 10), time: invitation.akad_time || "", location: invitation.akad_location || "", mapsUrl: invitation.maps_url || "" },
        { name: "Resepsi", date: String(invitation.resepsi_date || "").slice(0, 10), time: invitation.reception_time || "", location: invitation.reception_location || "", mapsUrl: invitation.maps_url || "" },
      ].filter((event) => event.date || event.time || event.location);
      const initialEvents = storedEvents.length ? storedEvents : legacyEvents;
      setWeddingEvents(initialEvents);
      setCoverEventIndex(Number.isInteger(invitation.cover_event_index) ? Math.min(Math.max(invitation.cover_event_index, 0), Math.max(initialEvents.length - 1, 0)) : Math.min(initialEvents.length > 1 ? 1 : 0, 3));

      setForm({''','load')
          sub(r'    const payload = \{\n      \.\.\.form,',r'''    const normalizedEvents = weddingEvents.slice(0, 4).map((event) => ({ name: event.name.trim(), date: event.date || "", time: event.time.trim(), location: event.location.trim(), mapsUrl: event.mapsUrl.trim() })).filter((event) => event.name || event.date || event.time || event.location || event.mapsUrl);
    const firstEvent = normalizedEvents[0];
    const secondEvent = normalizedEvents[1];
    const payload = {
      ...form,
      events: form.category === "wedding" ? normalizedEvents : null,
      cover_event_index: form.category === "wedding" && normalizedEvents.length ? Math.min(coverEventIndex, normalizedEvents.length - 1) : null,''','save')
          sub(r'      akad_date: form\.akad_date \|\| null,\n      resepsi_date: form\.resepsi_date \|\| null,',r'''      akad_date: form.category === "wedding" ? firstEvent?.date || null : form.akad_date || null,
      akad_time: form.category === "wedding" ? firstEvent?.time || "" : form.akad_time,
      akad_location: form.category === "wedding" ? firstEvent?.location || "" : form.akad_location,
      resepsi_date: form.category === "wedding" ? secondEvent?.date || null : form.resepsi_date || null,
      reception_time: form.category === "wedding" ? secondEvent?.time || "" : form.reception_time,
      reception_location: form.category === "wedding" ? secondEvent?.location || "" : form.reception_location,
      maps_url: form.category === "wedding" ? firstEvent?.mapsUrl || secondEvent?.mapsUrl || "" : form.maps_url,''','legacy')
          ui='''        <h2 className={styles.editSectionTitle}>Jadwal &amp; Lokasi Acara</h2>
        <p className={styles.helpText} style={{ marginTop: -8 }}>Maksimal 4 acara. Nama acara bebas: Akad, Resepsi, Pemberkatan, Ngunduh Mantu, Temu Manten, dan lainnya.</p>
        <div style={{ display: "grid", gap: 16 }}>
          {weddingEvents.map((event, index) => (
            <div key={index} className={styles.storyBlock}>
              <div className={styles.formGrid}>
                <input placeholder={`Nama Acara ${index + 1}`} value={event.name} onChange={(e) => setWeddingEvents((prev) => prev.map((item, i) => i === index ? { ...item, name: e.target.value } : item))} className={styles.input} />
                <input type="date" value={event.date} onChange={(e) => setWeddingEvents((prev) => prev.map((item, i) => i === index ? { ...item, date: e.target.value } : item))} className={styles.input} />
                <input placeholder="Jam, contoh: 08.00 WIB" value={event.time} onChange={(e) => setWeddingEvents((prev) => prev.map((item, i) => i === index ? { ...item, time: e.target.value } : item))} className={styles.input} />
                <input placeholder="Lokasi acara" value={event.location} onChange={(e) => setWeddingEvents((prev) => prev.map((item, i) => i === index ? { ...item, location: e.target.value } : item))} className={styles.input} />
                <input placeholder="Google Maps URL (opsional)" value={event.mapsUrl} onChange={(e) => setWeddingEvents((prev) => prev.map((item, i) => i === index ? { ...item, mapsUrl: e.target.value } : item))} className={styles.input} style={{ gridColumn: "1 / -1" }} />
              </div>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginTop: 10 }}>
                <label className={styles.helpText} style={{ margin: 0 }}><input type="radio" name="cover-event" checked={coverEventIndex === index} onChange={() => setCoverEventIndex(index)} style={{ marginRight: 6 }} />Pakai tanggal acara ini di cover</label>
                <button type="button" className={styles.secondaryButton} onClick={() => { setWeddingEvents((prev) => prev.filter((_, i) => i !== index)); setCoverEventIndex((current) => current > index ? current - 1 : Math.min(current, Math.max(0, weddingEvents.length - 2))); }}>Hapus Acara</button>
              </div>
            </div>
          ))}
          {weddingEvents.length < 4 && <button type="button" className={styles.secondaryButton} onClick={() => setWeddingEvents((prev) => [...prev, emptyWeddingEvent()])}>+ Tambah Acara</button>}
        </div>

        <h2 className={styles.editSectionTitle}>Kata Pembuka (opsional)</h2>'''
          sub(r'        <h2 className=\{styles\.editSectionTitle\}>Jadwal &amp; Lokasi Acara</h2>\n\n        <div className=\{styles\.formGrid\}>\n          <input\n            type="date"\n            value=\{form\.akad_date\}.*?        <h2 className=\{styles\.editSectionTitle\}>Kata Pembuka \(opsional\)</h2>',ui,'ui',re.S)
          p.write_text(s)
          PY
          grep -q 'Tambah Acara' 'app/reseller/invitations/[id]/page.tsx'
          grep -q 'cover_event_index' 'app/reseller/invitations/[id]/page.tsx'
      - name: Commit
        run: |
          git config user.name vistiqstudio-invitation
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/patch-flexible-events.yml
          git add 'app/reseller/invitations/[id]/page.tsx'
          git commit -m 'feat: support up to four flexible wedding events'
          git push origin HEAD:main
