name: Build Cloudflare deployment package

on:
  push:
    branches: [ops/cloudflare-linux-build-artifact]
    paths:
      - '.github/workflows/cloudflare-deployment-package.yml'
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'wrangler.jsonc'
      - 'package*.json'
      - 'deploy-vistiq.cmd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://tvjifuzhakaymzottdyf.supabase.co
      # This is the public Supabase publishable key, NOT a service-role secret.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pe4yd2dJbx_5Y5qj-8qYLA_QVhV0-Ie
      NODE_OPTIONS: --max-old-space-size=6144
      CI: true
    steps:
      - name: Check out Vistiq code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Run recovery tests
        run: npm run test:recovery
      - name: Build with OpenNext for Cloudflare
        run: npm run build:cloudflare
      - name: Validate Cloudflare worker package
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx wrangler deploy --dry-run
      - name: Create deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: vistiq-cloudflare-ready
          path: |
            .open-next/
            wrangler.jsonc
            deploy-vistiq.cmd
          include-hidden-files: true
          compression-level: 9
          if-no-files-found: error
          retention-days: 7
