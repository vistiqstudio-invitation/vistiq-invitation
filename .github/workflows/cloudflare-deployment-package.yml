name: Build Cloudflare deployment package

on:
  push:
    branches: [main, ops/cloudflare-linux-build-artifact, fix/portable-opennext-wasm, ops/admin-client-reset-release-20261106, fix/reseller-domain-popup-20261107, fix/midtrans-signature-secret-20261109]
    paths:
      - '.github/workflows/cloudflare-deployment-package.yml'
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'components/**'
      - 'themes/**'
      - 'hooks/**'
      - 'types/**'
      - 'styles/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package*.json'
      - 'deploy-vistiq.cmd'
      - 'scripts/portable-wasm.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://tvjifuzhakaymzottdyf.supabase.co
      # This is the public Supabase publishable key, NOT a service-role secret.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pe4yd2dJbx_5Y5qj-8qYLA_QVhV0-Ie
      NODE_OPTIONS: --max-old-space-size=6144
      CI: true
    steps:
      - name: Check out Vistiq code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Run recovery tests
        run: npm run test:recovery
      - name: Build with OpenNext for Cloudflare
        run: npm run build:cloudflare
      - name: Rebase absolute WebAssembly imports for Windows deployment
        run: |
          node scripts/portable-wasm.cjs
          node scripts/portable-wasm.cjs --verify
      - name: Validate Cloudflare worker package
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx wrangler deploy --dry-run
      - name: Test deployable package from relocated directory
        run: |
          mkdir -p "$RUNNER_TEMP/vistiq-relocated/scripts"
          mv .open-next "$RUNNER_TEMP/vistiq-relocated/.open-next"
          cp wrangler.jsonc "$RUNNER_TEMP/vistiq-relocated/"
          cp scripts/portable-wasm.cjs "$RUNNER_TEMP/vistiq-relocated/scripts/"
          node "$RUNNER_TEMP/vistiq-relocated/scripts/portable-wasm.cjs" --verify
          npx wrangler deploy --dry-run --config "$RUNNER_TEMP/vistiq-relocated/wrangler.jsonc"
          mv "$RUNNER_TEMP/vistiq-relocated/.open-next" .open-next
      - name: Create deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: vistiq-cloudflare-ready
          path: |
            .open-next/
            wrangler.jsonc
            deploy-vistiq.cmd
            scripts/portable-wasm.cjs
          include-hidden-files: true
          compression-level: 9
          if-no-files-found: error
          retention-days: 7

      - name: Check Cloudflare deployment credential availability
        id: cf_auth
        if: github.ref == 'refs/heads/main'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped; set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets, or deploy the generated artifact with deploy-vistiq.cmd."
          fi
      - name: Deploy verified package to Vistiq Cloudflare Worker
        if: github.ref == 'refs/heads/main' && steps.cf_auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
