name: Champagne Romance Visual Check

on:
  push:
    branches:
      - feat/champagne-romance-rebuild

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: visual-check-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Install app and Playwright
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Start local app
        run: |
          npm run dev > /tmp/vistiq-dev.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/demo/luxury-art-champagne-romance >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vistiq-dev.log
          exit 1

      - name: Capture hydrated reference checkpoints
        run: |
          mkdir -p visual-check
          cat > capture-visual.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 848 }, deviceScaleFactor: 1 });
            const logs = [];
            page.on('console', msg => logs.push(`[console:${msg.type()}] ${msg.text()}`));
            page.on('pageerror', err => logs.push(`[pageerror] ${err.stack || err.message}`));
            try {
              await page.goto('http://localhost:3000/demo/luxury-art-champagne-romance', { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForTimeout(500);
              await page.screenshot({ path: 'visual-check/01-cover.png' });
              await page.getByRole('button', { name: /Buka Undangan/i }).click();
              await page.waitForTimeout(1200);
              const content = page.locator('[class*="content"]').first();
              await content.waitFor({ state: 'visible', timeout: 5000 });
              const shots = [
                ['02-home.png', '#home'],
                ['03-quote.png', '[class*="quoteSection"]'],
                ['04-couple.png', '#couple'],
                ['05-event.png', '#event'],
                ['06-gallery.png', '#gallery'],
                ['07-story.png', '#story'],
                ['08-wishes.png', '#wishes'],
                ['09-gift.png', '#gift'],
              ];
              for (const [file, selector] of shots) {
                const target = page.locator(selector).first();
                await target.scrollIntoViewIfNeeded();
                await page.waitForTimeout(320);
                await page.screenshot({ path: `visual-check/${file}` });
              }
              await page.screenshot({ path: 'visual-check/10-full.png', fullPage: true });
            } catch (err) {
              fs.writeFileSync('visual-check/error.txt', String(err && err.stack ? err.stack : err));
              throw err;
            } finally {
              fs.writeFileSync('visual-check/browser.log', logs.join('\n'));
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          node capture-visual.cjs

      - name: Save dev log
        if: always()
        run: cp /tmp/vistiq-dev.log visual-check/dev.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: champagne-romance-visual-check
          path: visual-check/*
          if-no-files-found: warn
          retention-days: 1
