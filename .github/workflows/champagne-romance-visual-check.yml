name: Champagne Romance Visual Check

on:
  push:
    branches:
      - feat/champagne-romance-rebuild

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: visual-check-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Install app and Playwright
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Start local app
        run: |
          npm run dev > /tmp/vistiq-dev.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/demo/luxury-art-champagne-romance >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vistiq-dev.log
          exit 1

      - name: Inspect cover button
        run: |
          mkdir -p visual-check
          cat > capture-visual.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 848 }, deviceScaleFactor: 1 });
            const logs = [];
            page.on('console', msg => logs.push(`[console:${msg.type()}] ${msg.text()}`));
            page.on('pageerror', err => logs.push(`[pageerror] ${err.stack || err.message}`));
            await page.goto('http://127.0.0.1:3000/demo/luxury-art-champagne-romance', { waitUntil: 'networkidle', timeout: 90000 });
            const button = page.getByRole('button', { name: /Buka Undangan/i }).first();
            const before = await button.evaluate((el) => {
              const keys = Object.keys(el);
              const propKey = keys.find(k => k.startsWith('__reactProps$'));
              const props = propKey ? el[propKey] : null;
              return {
                outerHTML: el.outerHTML,
                reactKeys: keys.filter(k => k.startsWith('__react')).slice(0,10),
                propKeys: props ? Object.keys(props) : [],
                onClickType: props ? typeof props.onClick : null,
                disabled: el.disabled,
              };
            });
            await page.screenshot({ path: 'visual-check/01-cover.png' });
            await button.click();
            await page.waitForTimeout(500);
            const afterClick = await page.evaluate(() => ({
              contentClass: document.querySelector('[class*="content"]')?.className || null,
              coverExists: !!document.querySelector('[class*="coverLayer"]'),
            }));
            const direct = await button.evaluate((el) => {
              const propKey = Object.keys(el).find(k => k.startsWith('__reactProps$'));
              const props = propKey ? el[propKey] : null;
              if (props && typeof props.onClick === 'function') props.onClick({ preventDefault(){}, stopPropagation(){} });
              return !!(props && typeof props.onClick === 'function');
            });
            await page.waitForTimeout(500);
            const afterDirect = await page.evaluate(() => ({
              contentClass: document.querySelector('[class*="content"]')?.className || null,
              coverExists: !!document.querySelector('[class*="coverLayer"]'),
            }));
            fs.writeFileSync('visual-check/button.json', JSON.stringify({ before, afterClick, direct, afterDirect }, null, 2));
            fs.writeFileSync('visual-check/browser.log', logs.join('\n'));
            await page.screenshot({ path: 'visual-check/02-after.png' });
            await browser.close();
          })().catch(err => { fs.writeFileSync('visual-check/error.txt', String(err && err.stack ? err.stack : err)); console.error(err); process.exit(1); });
          EOF
          node capture-visual.cjs

      - name: Save dev log
        if: always()
        run: cp /tmp/vistiq-dev.log visual-check/dev.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: champagne-romance-visual-check
          path: visual-check/*
          if-no-files-found: warn
          retention-days: 1
